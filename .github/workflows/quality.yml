name: quality

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.92"
  WASM_PACK_VERSION: 0.13.1
  VCPKG_ROOT: "${{ github.workspace }}/vcpkg"

jobs:
  ensure-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: cargo install --locked wasm-pack --version ${{ env.WASM_PACK_VERSION }}
      - name: Build account-wasm
        working-directory: account-wasm
        run: ./build.sh
      - name: Set up Chrome for WASM regression tests
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-chromedriver: true
      - name: Test browser session execution
        env:
          # build.sh overrides setup-rust-toolchain's -D warnings for WASM too.
          RUSTFLAGS: ""
          CHROME: ${{ steps.chrome.outputs.chrome-path }}
          CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
          CARGO_TARGET_WASM32_UNKNOWN_UNKNOWN_RUNNER: wasm-bindgen-test-runner
          WASM_BINDGEN_TEST_WEBDRIVER_JSON: ${{ runner.temp }}/session-webdriver.json
        run: |
          wasm_bindgen_version=$(cargo metadata --format-version=1 | jq -r '.packages[] | select(.name == "wasm-bindgen") | .version')
          cargo install wasm-bindgen-cli --version "$wasm_bindgen_version" --locked
          jq -n --arg binary "$CHROME" '{"goog:chromeOptions": {binary: $binary}}' > "$WASM_BINDGEN_TEST_WEBDRIVER_JSON"
          cargo test -p account-wasm --target wasm32-unknown-unknown --features controller_account --lib browser_session

  ensure-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          target: x86_64-pc-windows-msvc
      - run: cargo build --target x86_64-pc-windows-msvc -p account_sdk

  lint:
    name: Code Quality (mirrors pre-commit hooks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Setup Rust with required components
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      # Setup Scarb for Cairo formatting
      - name: Setup Scarb
        uses: software-mansion/setup-scarb@v1
        with:
          scarb-version: "2.9.4"

      # Setup Node.js and prettier for documentation formatting
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install prettier
        run: npm install -g prettier

      # Make scripts executable
      - name: Make scripts executable
        run: chmod +x bin/*

      # Run all linting checks (mirrors the pre-commit hooks exactly)
      - name: Run all linting checks
        run: make lint-check
